<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mod submission leaderboard</title>
<style>
  body {
    background: #000;
    color: #fff;
    font: 18px arial, sans-serif;
    text-transform: lowercase;
    margin: 40px auto;
    max-width: 800px;
    text-align: center;
  }

  h1 {
    font-size: 34px;
  }

  select {
    font: 18px arial, sans-serif;
    background: #000;
    color: #fff;
    border: 1px solid #fff;
  }

  a {
    color: #fff;
  }

  table {
    margin: 30px auto;
    border-collapse: collapse;
    min-width: 80%;
    font-size: 30px;
  }

  td,
  th {
    padding: 10px 24px;
    border-bottom: 1px solid #fff;
  }

  #s {
    position: relative;
    display: inline-block;
    width: 220px;
    height: 22px;
    vertical-align: middle;
  }

  #s input {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 22px;
    margin: 0;
    background: none;
    pointer-events: none;
    -webkit-appearance: none;
    appearance: none;
  }

  #s input::-webkit-slider-runnable-track {
    height: 2px;
    background: #fff;
  }

  #s input::-moz-range-track {
    height: 2px;
    background: #fff;
  }

  #s input::-webkit-slider-thumb {
    -webkit-appearance: none;
    pointer-events: auto;
    width: 16px;
    height: 16px;
    margin-top: -7px;
    background: #fff;
    border: 0;
    border-radius: 50%;
    cursor: pointer;
  }

  #s input::-moz-range-thumb {
    pointer-events: auto;
    width: 16px;
    height: 16px;
    background: #fff;
    border: 0;
    border-radius: 50%;
    cursor: pointer;
  }
</style>
<h1>mod submission leaderboard</h1>
showing top
<select id="n">
  <option>10</option>
  <option>50</option>
  <option>100</option>
</select>
date range
<span id="s">
  <input id="lo" type="range" min="2018" max="2026" value="2018">
  <input id="hi" type="range" min="2018" max="2026" value="2026">
</span>
<span id="y"></span>
<table>
  <thead>
    <tr>
      <th>#</th>
      <th>user</th>
      <th>mods</th>
    </tr>
  </thead>
  <tbody id="l"></tbody>
</table>
<script>
  let records = [];
  const API = 'https://gamebanana.com/apiv11/Mod/Index?_nPerpage=50' +
      '&_aFilters[Generic_Game]=6460&_nPage=';

  function show() {
    const from = Number(lo.value);
    const to = Number(hi.value);
    const users = {};
    y.textContent = from + '-' + to;
    for (const r of records) {
      if (r.year >= from && r.year <= to) {
        users[r.id] = users[r.id] || {name: r.name, url: r.url, count: 0};
        users[r.id].count++;
      }
    }
    l.innerHTML = '';
    Object.values(users)
        .sort((a, b) => b.count - a.count)
        .slice(0, Number(n.value))
        .forEach((u, i) => {
          const row = l.insertRow();
          const link = document.createElement('a');
          link.textContent = u.name;
          link.href = u.url;
          row.insertCell().textContent = i + 1;
          row.insertCell().append(link);
          row.insertCell().textContent = u.count;
        });
  }

  async function getPage(page) {
    for (let attempt = 0;; attempt++) {
      try {
        return await (await fetch(API + page)).json();
      } catch (e) {
        if (attempt > 1) {
          throw e;
        }
        await new Promise((resolve) => setTimeout(resolve, 800));
      }
    }
  }

  function add(data) {
    for (const r of data._aRecords) {
      const submitter = r._aSubmitter;
      if (submitter) {
        records.push({
          id: submitter._idRow,
          name: submitter._sName,
          url: submitter._sProfileUrl,
          year: new Date(r._tsDateAdded * 1000).getFullYear(),
        });
      }
    }
  }

  async function load() {
    records = [];
    try {
      const first = await getPage(1);
      const pages = Math.ceil(first._aMetadata._nRecordCount / 50);
      let next = 2;
      add(first);
      show();
      const worker = async () => {
        while (next <= pages) {
          add(await getPage(next++));
          show();
        }
      };
      await Promise.all([worker(), worker(), worker(), worker()]);
    } catch (e) {
      l.innerHTML = '<tr><td colspan="3">error: ' + e.message + '</td></tr>';
    }
  }

  n.onchange = show;
  lo.oninput = () => {
    if (Number(lo.value) > Number(hi.value)) {
      hi.value = lo.value;
    }
    show();
  };
  hi.oninput = () => {
    if (Number(hi.value) < Number(lo.value)) {
      lo.value = hi.value;
    }
    show();
  };
  show();
  load();
</script>
